<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>윗첨자/아래첨자 누락 문항 복구</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #0f172a; }
  button { padding: 0.7rem 1.3rem; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-right: 0.5rem; }
  #btn-login { background: #2563eb; color: white; }
  .item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  .field-diff { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.6rem; margin: 0.4rem 0; font-size: 0.85rem; }
  .field-diff .label { font-weight: bold; color: #475569; margin-bottom: 0.3rem; }
  .before { color: #dc2626; text-decoration: line-through; }
  .after { color: #16a34a; }
  .btn-fix { background: #16a34a; color: white; }
  .ok { color: #16a34a; font-weight: bold; }
  .err { color: #dc2626; font-weight: bold; }
</style>
</head>
<body>
  <h1>윗첨자/아래첨자 누락 문항 복구</h1>
  <p>DB 전체를 스캔해 (1) 방사성 동위원소 표기(15N, 14N, 32P, 35S 등)에 &lt;sup&gt; 태그가 빠진 문항 5건, (2) "10^5"처럼 캐럿(^)만 쓰고 &lt;sup&gt;은 안 쓴 10의 거듭제곱 표기 문항 6건, 총 11건을 찾았습니다. ($...$ 로 감싼 수식은 MathJax가 알아서 위첨자로 그려주므로 그런 경우는 건드리지 않았습니다.) 아래에서 문서별로 변경 전/후를 확인하고 적용하세요.</p>
  <span id="login-status">로그인 필요</span><br><br>
  <button id="btn-login">Google로 로그인</button>
  <div id="results"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDV_er1ecvJ6ll_6nqiHe10W7nX6kvEyt4",
  authDomain: "science-asa1-13844073-164bb.firebaseapp.com",
  projectId: "science-asa1-13844073-164bb",
  storageBucket: "science-asa1-13844073-164bb.firebasestorage.app",
  messagingSenderId: "946177749957",
  appId: "1:946177749957:web:c3a98314a79871d219d1ac"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 💡 각 문서별 정확한 수정 대상을 사전에 스캔·검증해 하드코딩했습니다(REST API로 전체 600건을 훑어
// 방사성 동위원소 등 표기에 <sup>가 필요한데 순수 텍스트로만 저장된 경우만 골라낸 결과).
const FIXES = [
  {
    id: "6NLbPN17l5WxuJwsFwEy",
    title: "허시-체이스 실험 (12유전01-05, A)",
    fields: [
      { field: "options", index: 0, replace: [[/32P/g, "<sup>32</sup>P"], [/35S/g, "<sup>35</sup>S"]] },
      { field: "levelReason", replace: [[/32P/g, "<sup>32</sup>P"], [/35S/g, "<sup>35</sup>S"]] }
    ]
  },
  {
    id: "CzjJSITuGfxJl2aWp0cD",
    title: "반보존적 복제 계산 문항 (12유전01-07, B)",
    fields: [
      { field: "question", replace: [[/\b15N\b/g, "<sup>15</sup>N"], [/\b14N\b/g, "<sup>14</sup>N"]] },
      { field: "levelReason", replace: [[/\b15N\b/g, "<sup>15</sup>N"], [/\b14N\b/g, "<sup>14</sup>N"]] }
    ]
  },
  {
    id: "KjjWICZjPPTcGG5hjVIS",
    title: "메셀슨-스탈 실험 (12유전01-07, A)",
    fields: [
      { field: "question", replace: [[/\b15N\b/g, "<sup>15</sup>N"], [/\b14N\b/g, "<sup>14</sup>N"]] },
      { field: "conditions", index: 0, replace: [[/\b15N\b/g, "<sup>15</sup>N"], [/\b14N\b/g, "<sup>14</sup>N"]] },
      { field: "conditions", index: 2, replace: [[/\b14N\b/g, "<sup>14</sup>N"]] },
      { field: "levelReason", replace: [[/\b15N\b/g, "<sup>15</sup>N"], [/\b14N\b/g, "<sup>14</sup>N"]] }
    ]
  },
  {
    id: "nclRLO1XStf8GwQeqWuS",
    title: "자기 방사법 문항 (12세포01-03, A)",
    fields: [
      { field: "levelReason", replace: [[/\b3H\b/g, "<sup>3</sup>H"], [/\b14C\b/g, "<sup>14</sup>C"]] }
    ]
  },
  {
    id: "vEJfKL97dqu9UroLF3F6",
    title: "엥겔만 광합성 실험 (12세포03-08, A)",
    fields: [
      { field: "levelReason", replace: [[/\b14C\b/g, "<sup>14</sup>C"]] }
    ]
  },
  // 💡 아래부터는 "10^5"처럼 캐럿(^)으로만 쓴 10의 거듭제곱 표기에 <sup>가 빠진 경우입니다.
  // $...$ (MathJax 수식)로 이미 감싸져 있는 10^5는 정상적으로 위첨자로 렌더링되므로 건드리지
  // 않았고, 순수 텍스트로만 "10^5"라고 쓴 경우만 골라 <sup>로 바꿉니다.
  {
    id: "2LxyWLI8phM5eRDzuWNN",
    title: "레이저 두께 측정 문항 (10통과1-01-01, A)",
    fields: [
      { field: "question", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  },
  {
    id: "tbHdkahJIp3ermtxG5RT",
    title: "레이저 두께 측정 문항 (10통과1-01-02, A)",
    fields: [
      { field: "question", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  },
  {
    id: "5gu3vhG1k4DjtxUMb6f4",
    title: "규모(스케일) 문항 (10통과1-01-01, C)",
    fields: [
      { field: "levelReason", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  },
  {
    id: "72EIwV56cvhhGWObmKU4",
    title: "레이저 홈 깊이 측정 문항 (10통과1-01-01, A)",
    fields: [
      { field: "question", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] },
      { field: "aiReason", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  },
  {
    id: "wrMpLjg8DGdu7U9SxSnV",
    title: "레이저 홈 깊이 측정 문항 (10통과1-01-02, A)",
    fields: [
      { field: "question", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] },
      { field: "aiReason", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  },
  {
    id: "UyjP3fRdXfLUy9C7KZGk",
    title: "빛 속력 두께 측정 문항 (10통과01-01, A)",
    fields: [
      { field: "question", replace: [[/10\^(-?\d+)/g, "10<sup>$1</sup>"]] }
    ]
  }
];

function applyReplacements(text, replacements) {
  let result = text;
  replacements.forEach(([pattern, to]) => { result = result.replace(pattern, to); });
  return result;
}

document.getElementById('btn-login').addEventListener('click', async () => {
  await signInWithPopup(auth, new GoogleAuthProvider());
});

onAuthStateChanged(auth, (user) => {
  const statusEl = document.getElementById('login-status');
  if (!user) { statusEl.textContent = '로그인 필요'; return; }
  statusEl.textContent = `로그인됨: ${user.email}`;
  renderList();
});

async function renderList() {
  const container = document.getElementById('results');
  container.innerHTML = '불러오는 중...';
  container.innerHTML = '';

  for (const fix of FIXES) {
    const ref = doc(db, "questions", fix.id);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<b>${fix.id}</b> — <span class="err">문서를 찾을 수 없습니다(이미 삭제되었을 수 있음)</span>`;
      container.appendChild(div);
      continue;
    }
    const data = snap.data();

    const div = document.createElement('div');
    div.className = 'item';
    let html = `<div><b>${fix.title}</b> <span style="color:#94a3b8;">(${fix.id})</span></div>`;

    const updatePayload = {};
    fix.fields.forEach(f => {
      let before, after;
      if (f.index !== undefined) {
        before = (data[f.field] || [])[f.index] || '';
        after = applyReplacements(before, f.replace);
        if (!updatePayload[f.field]) updatePayload[f.field] = [...(data[f.field] || [])];
        updatePayload[f.field][f.index] = after;
      } else {
        before = data[f.field] || '';
        after = applyReplacements(before, f.replace);
        updatePayload[f.field] = after;
      }
      html += `
        <div class="field-diff">
          <div class="label">${f.field}${f.index !== undefined ? '[' + f.index + ']' : ''}</div>
          <div class="before">${before.replace(/</g, '&lt;')}</div>
          <div class="after">${after.replace(/</g, '&lt;')}</div>
        </div>
      `;
    });

    html += `<button class="btn-fix">이 문항에 적용</button> <span class="status" style="margin-left:0.5rem;"></span>`;
    div.innerHTML = html;

    div.querySelector('.btn-fix').addEventListener('click', async (e) => {
      const btn = e.target;
      const statusSpan = div.querySelector('.status');
      btn.disabled = true;
      try {
        await updateDoc(ref, updatePayload);
        statusSpan.textContent = '✅ 수정 완료';
        statusSpan.className = 'status ok';
      } catch (err) {
        statusSpan.textContent = '❌ 실패: ' + err.message;
        statusSpan.className = 'status err';
        btn.disabled = false;
      }
    });

    container.appendChild(div);
  }
}
</script>
</body>
</html>
