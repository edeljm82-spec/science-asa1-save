<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>깨진 성취기준 문서 삭제 (12생유01-02)</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #0f172a; }
  button { padding: 0.7rem 1.3rem; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-right: 0.5rem; }
  #btn-login { background: #2563eb; color: white; }
  #btn-fix { background: #dc2626; color: white; }
  #btn-fix:disabled { background: #94a3b8; cursor: not-allowed; }
  #status { white-space: pre-wrap; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 0.9rem; line-height: 1.6; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>깨진 성취기준 문서 삭제</h1>
  <p>standards 컬렉션의 <b>12생유01-02</b> 문서는 course/unit/description이 전부 비어있는 깨진 데이터입니다.
  이 문서 때문에 'AI문항제작'과 '문제은행 시험지제작'의 과목 드롭다운에 "공통"이라는 잘못된 과목이 나타납니다.
  아래 버튼으로 이 문서를 삭제합니다.</p>
  <div>
    <span id="login-status">로그인 필요</span><br><br>
    <button id="btn-login">Google로 로그인</button>
    <button id="btn-fix" disabled>깨진 문서 삭제 실행</button>
  </div>
  <div id="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDV_er1ecvJ6ll_6nqiHe10W7nX6kvEyt4",
  authDomain: "science-asa1-13844073-164bb.firebaseapp.com",
  projectId: "science-asa1-13844073-164bb",
  storageBucket: "science-asa1-13844073-164bb.firebasestorage.app",
  messagingSenderId: "946177749957",
  appId: "1:946177749957:web:c3a98314a79871d219d1ac"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginStatus = document.getElementById('login-status');
const btnLogin = document.getElementById('btn-login');
const btnFix = document.getElementById('btn-fix');
const statusEl = document.getElementById('status');

function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  statusEl.appendChild(line);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginStatus.textContent = `로그인됨: ${user.email}`;
    btnFix.disabled = false;
  } else {
    loginStatus.textContent = '로그인 필요';
    btnFix.disabled = true;
  }
});

btnLogin.addEventListener('click', async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    log('로그인 실패: ' + e.message, 'err');
  }
});

const TARGET_ID = "12생유01-02";

btnFix.addEventListener('click', async () => {
  btnFix.disabled = true;
  statusEl.innerHTML = '';
  try {
    const ref = doc(db, "standards", TARGET_ID);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      log(`${TARGET_ID} 문서가 이미 없습니다. (삭제 완료 상태)`, 'ok');
      return;
    }
    const data = snap.data();
    if (data.course || data.unit || data.description) {
      log(`중단: 이 문서에 course/unit/description 값이 채워져 있어 예상과 다릅니다. 안전을 위해 삭제하지 않았습니다.`, 'err');
      log(JSON.stringify(data), 'err');
      btnFix.disabled = false;
      return;
    }
    await deleteDoc(ref);
    log(`OK ${TARGET_ID} 삭제 완료`, 'ok');
  } catch (e) {
    log(`FAIL: ${e.message}`, 'err');
    btnFix.disabled = false;
  }
});
</script>
</body>
</html>
